<style>
  :root{--bg:#0b0f1a;--panel:#121828;--text:#e8ecf4;--muted:#9aa4b2;--accent:#7c5cff;--accent2:#22d3ee;--border:#222a40}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
  a{color:var(--accent2)}
  header{padding:18px 6vw;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:800;font-size:20px}
  .logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .logo a{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);transition:all .2s;font-size:14px;font-weight:700;color:var(--text);text-decoration:none}
  .logo a:hover{border-color:var(--accent);background:rgba(124,92,255,.1)}
  .lang-switch{display:flex;gap:6px}
  .lang-switch button{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s}
  .lang-switch button:hover,.lang-switch button.active{color:#fff;border-color:var(--accent)}
  main{max-width:780px;margin:0 auto;padding:40px 6vw 70px}
  h1{font-size:30px;margin-bottom:6px}
  .upd{color:var(--muted);font-size:13px;margin-bottom:26px}
  h2{font-size:18px;margin:28px 0 8px;color:#fff}
  p,li{font-size:14.5px;color:#d3d9e6;margin-bottom:10px}
  ul{margin:0 0 12px 22px}
  li{margin-bottom:6px}
  .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin:18px 0}
  footer{border-top:1px solid var(--border);padding:26px 6vw;color:var(--muted);font-size:13px;text-align:center}
  strong{color:#fff}
</style>
</head>
<body>
<header>
  <div class="logo"><a href="index.html"><span style="font-size:16px">←</span> <span data-t="backHome">Back to Home</span></a></div>

}

  document.getElementById('content').innerHTML=h;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.innerHTML=t[el.getAttribute('data-t')]||''; });
  document.querySelectorAll('.lang-switch button').forEach(function(b){ b.classList.toggle('active',b.getAttribute('data-lang')===lang); });
}

var currentLang=getLang();
render(currentLang);

document.getElementById('langSwitch').addEventListener('click',function(e){
  var btn=e.target.closest('button[data-lang]'); if(!btn) return;
  currentLang=btn.getAttribute('data-lang');
  try{ localStorage.setItem('pp_lang',currentLang); }catch(ex){}
  render(currentLang);
});

})();
</script>
